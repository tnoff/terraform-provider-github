name: CI

# Pull-request checks for the fork. Deliberately smaller than
# upstream's CI: no golangci-lint (it tracks `latest` and would fail this
# pinned v6.13.0 base for reasons unrelated to our patch), no acceptance tests
# (they need an org-scoped token and a live GitHub org). See FORK.md.

# Pull requests only. A merge to main runs nothing here: the PR's checks already
# covered the same commit, and a tag push is what builds a release.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set-up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      # Same -skip as upstream's `make test`: not every TestAcc* guards itself
      # on TF_ACC (TestAccGithubActionsOrganizationPermissions panics without a
      # live org), so they are excluded by name. This is the unit suite plus
      # compilation of every test file, including our new resources' tests.
      - name: Test
        run: CGO_ENABLED=0 go test ./... -skip '^TestAcc' -timeout=10m -count=1

  secrets:
    name: Scan for secrets
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@b7790887a768e86127e2b6a29ed06631c947972f # trufflehog-v1.0.1

  contracts:
    name: Workflow contracts
    uses: tnoff/github-workflows/.github/workflows/check-workflow-contracts.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d # check-workflow-contracts-v1.0.0

  # The single context to require in the ruleset. An aggregate means the
  # required-check list never changes when jobs are added or renamed.
  result:
    name: CI result
    if: always()
    needs: [test, secrets, contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::a required job finished as '${r}'"
              exit 1
            fi
          done
