name: Release

# A pushed v* tag builds the binaries with GoReleaser and publishes them to a
# GitHub release with a SHA256SUMS file and a build-provenance attestation.
# Not signed with GPG or cosign (upstream's signing keys are not available
# here); the attestation is what proves the zips came from this workflow, and
# `gh attestation verify` checks it. See FORK.md.
#
# workflow_dispatch runs a snapshot build instead: nothing is published, the
# dist/ output is uploaded as a workflow artifact, so the pipeline can be
# tested without cutting a tag.

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # GoReleaser reads older tags to compute the version and changelog.
          fetch-depth: 0

      - name: Set-up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        id: goreleaser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}

      - name: Attest artifacts
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: ./dist/${{ github.event.repository.name }}_${{ fromJSON(steps.goreleaser.outputs.metadata).version }}_SHA256SUMS

      - name: Upload snapshot build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-dist
          path: dist/*.zip
          retention-days: 7
